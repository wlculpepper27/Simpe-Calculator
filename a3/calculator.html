<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
    body {
            background-color: magenta;  
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .content {
            background-color: #ADD8E6;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
            background-color: white;
        }
        
        th {
            background-color: lightskyblue;
            color: white;
            padding: 12px;
        }
        
        td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        
        h1 {
            color: magenta;
            text-align: center;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <script src ="calculator.js"></script>
</body>
</html>
